AWSTemplateFormatVersion: "2010-09-09"

Description: >
  One-time bootstrap for s3-zip-archiver. Creates the ECR repository that holds the
  Lambda container image, and the IAM role GitHub Actions assumes via OIDC to deploy.

  These resources are deliberately kept OUT of the application stack (template.yaml):
  a container-image Lambda requires its image to already exist in ECR before
  CloudFormation can create the function, so the repository cannot be created by the
  same stack that consumes it. ECR and CI credentials also have a different lifecycle
  from the application - they are created once and survive any number of app deploys.

Parameters:
  GitHubOwner:
    Type: String
    Default: farhan-helmy
    Description: GitHub user or org that owns the repository.

  GitHubRepo:
    Type: String
    Default: s3-zip-archiver
    Description: Repository name allowed to assume the deployment role.

  GitHubBranch:
    Type: String
    Default: main
    Description: >
      Only this branch may assume the deployment role. Pull requests run tests
      and template validation only, and need no AWS credentials at all.

  ExistingOidcProviderArn:
    Type: String
    Default: ""
    Description: >
      ARN of an existing GitHub OIDC provider. An AWS account may only have one
      provider per issuer URL, so if token.actions.githubusercontent.com is already
      registered, pass its ARN here and this stack will reuse it rather than fail
      with EntityAlreadyExists. Leave blank to create a new one.

  EcrRepositoryName:
    Type: String
    Default: s3-zip-archiver
    Description: Name of the ECR repository holding the Lambda image.

  ImageRetentionCount:
    Type: Number
    Default: 10
    Description: >
      Number of recent images to keep. Every deploy pushes a new immutable image;
      without expiry these accumulate indefinitely at $0.10/GB-month.

Conditions:
  CreateOidcProvider: !Equals [!Ref ExistingOidcProviderArn, ""]

Resources:
  # ---------------------------------------------------------------------------
  # Container registry for the Lambda image.
  # ---------------------------------------------------------------------------
  EcrRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Ref EcrRepositoryName
      # Immutable tags mean a given git SHA always refers to exactly one image.
      # This is what makes "every deploy publishes a new Lambda version" true:
      # SAM only publishes a version when the ImageUri string changes, so tags
      # must never be reused. CI checks whether a tag exists before pushing.
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: !Sub |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Retain only the most recent ${ImageRetentionCount} images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": ${ImageRetentionCount}
                },
                "action": { "type": "expire" }
              }
            ]
          }

  # ---------------------------------------------------------------------------
  # GitHub Actions OIDC federation - no long-lived AWS access keys anywhere.
  # ---------------------------------------------------------------------------
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      # AWS no longer validates these for the GitHub issuer, but the property
      # remains required by CloudFormation.
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  GitHubActionsDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${GitHubRepo}-github-actions-deploy"
      Description: Assumed by GitHub Actions via OIDC to deploy the application stack.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateOidcProvider
                - !Ref GitHubOidcProvider
                - !Ref ExistingOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                # Without the aud check the role could be assumed by any GitHub
                # workflow in any account.
                token.actions.githubusercontent.com:aud: sts.amazonaws.com

                # Pinned on the repository and ref claims rather than on sub.
                #
                # AWS's documentation, and essentially every guide online, tells
                # you to match sub against "repo:OWNER/NAME:ref:refs/heads/BRANCH".
                # GitHub has since moved to immutable subject claims that embed
                # numeric IDs, so the token this repository actually presents is:
                #
                #   repo:farhan-helmy@59960562/s3-zip-archiver@1317606042:ref:refs/heads/main
                #
                # A sub-based policy written to the documented format therefore
                # fails with "Not authorized to perform sts:AssumeRoleWithWebIdentity",
                # and the numeric IDs are not knowable before the repository
                # exists. This happens even though the repository still reports
                # use_immutable_subject: false.
                #
                # repository and ref are separate signed claims in the same
                # token, carry identical guarantees, and stay human-readable and
                # stable. These two are what actually constrain the role, and
                # they are exact matches: one branch of one repository.
                token.actions.githubusercontent.com:repository: !Sub "${GitHubOwner}/${GitHubRepo}"
                token.actions.githubusercontent.com:ref: !Sub "refs/heads/${GitHubBranch}"
              StringLike:
                # IAM will not accept a GitHub OIDC trust policy at all unless it
                # constrains sub or job_workflow_ref:
                #
                #   "Trust policy with trusted principal ... must evaluate, using
                #    StringEquals, StringLike or StringEqualsIgnoreCase,
                #    token.actions.githubusercontent.com:sub or
                #    token.actions.githubusercontent.com:job_workflow_ref which is
                #    not scoped to all."
                #
                # So sub has to appear. The wildcards absorb the optional @<id>
                # suffixes of the immutable format, matching both the legacy and
                # current shapes. This is deliberately the loose half of the
                # condition - "farhan-helmy*" would also match an attacker's
                # "farhan-helmy-x" account - which is precisely why the exact
                # repository match above is doing the real work. Both must pass.
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubOwner}*/${GitHubRepo}*:ref:refs/heads/${GitHubBranch}"
      Policies:
        - PolicyName: DeployApplicationStack
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # CloudFormation, limited to this project's stacks plus the SAM
              # transform macro that every SAM deploy must invoke.
              - Sid: CloudFormationStackAccess
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:DeleteStack
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResource
                  - cloudformation:DescribeStackResources
                  - cloudformation:GetTemplate
                  - cloudformation:GetTemplateSummary
                  - cloudformation:ListStackResources
                  - cloudformation:ValidateTemplate
                Resource:
                  - !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${GitHubRepo}/*"
                  # sam deploy --resolve-s3 provisions its artifact bucket through
                  # a second, separate stack of its own. Scoping the policy to
                  # this project's stack alone fails with AccessDenied on
                  # CreateChangeSet against aws-sam-cli-managed-default before
                  # the application stack is ever touched.
                  - !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/aws-sam-cli-managed-default/*"
                  - !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:aws:transform/Serverless-2016-10-31"

              # ECR: the authorization token endpoint is not resource-scopable,
              # push/pull is restricted to this project's repository.
              - Sid: EcrAuth
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: EcrPushPull
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:CompleteLayerUpload
                  - ecr:DescribeImages
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource: !GetAtt EcrRepository.Arn

              # SAM uploads the rendered template to its managed artifact bucket
              # when the template exceeds the inline size limit.
              - Sid: SamArtifactBucket
                Effect: Allow
                Action:
                  - s3:CreateBucket
                  - s3:GetBucketLocation
                  - s3:GetObject
                  - s3:ListBucket
                  - s3:PutObject
                  - s3:PutBucketPolicy
                  - s3:PutBucketVersioning
                  - s3:PutEncryptionConfiguration
                  - s3:PutLifecycleConfiguration
                Resource:
                  - !Sub "arn:${AWS::Partition}:s3:::aws-sam-cli-managed-*"
                  - !Sub "arn:${AWS::Partition}:s3:::aws-sam-cli-managed-*/*"

              # Resources the application stack creates and manages.
              - Sid: ApplicationResources
                Effect: Allow
                Action:
                  - lambda:*
                  - sqs:*
                  - cloudwatch:*
                  - logs:*
                  - s3:*
                Resource: "*"

              # VPC resources cannot be resource-scoped at creation time - the
              # ARN does not exist until the API call succeeds.
              - Sid: VpcResources
                Effect: Allow
                Action:
                  - ec2:CreateVpc
                  - ec2:DeleteVpc
                  - ec2:ModifyVpcAttribute
                  - ec2:CreateSubnet
                  - ec2:DeleteSubnet
                  - ec2:ModifySubnetAttribute
                  - ec2:CreateRouteTable
                  - ec2:DeleteRouteTable
                  - ec2:AssociateRouteTable
                  - ec2:DisassociateRouteTable
                  - ec2:CreateVpcEndpoint
                  - ec2:DeleteVpcEndpoints
                  - ec2:ModifyVpcEndpoint
                  - ec2:CreateSecurityGroup
                  - ec2:DeleteSecurityGroup
                  - ec2:AuthorizeSecurityGroupEgress
                  - ec2:RevokeSecurityGroupEgress
                  - ec2:CreateTags
                  - ec2:DeleteTags
                  - ec2:Describe*
                Resource: "*"

              # PassRole is scoped to roles this project's stack creates, so the
              # CI role cannot escalate by passing an unrelated privileged role.
              - Sid: ManageStackRoles
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:PassRole
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${GitHubRepo}-*"

  # ---------------------------------------------------------------------------
  # A second, weaker role for previewing changes and detecting drift.
  #
  # Pull requests must be able to answer "what will this actually do to AWS?"
  # without being able to do it. This role can create and read change sets but
  # cannot execute them, cannot push images, and cannot touch IAM. The blast
  # radius of it leaking is a stack full of unexecuted change sets.
  # ---------------------------------------------------------------------------
  GitHubActionsPlanRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${GitHubRepo}-github-actions-plan"
      Description: >
        Assumed by pull request and scheduled drift workflows. Read and preview
        only - deliberately cannot execute a change set.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateOidcProvider
                - !Ref GitHubOidcProvider
                - !Ref ExistingOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # As with the deploy role, the repository claim is the exact
                # match doing the real work.
                token.actions.githubusercontent.com:repository: !Sub "${GitHubOwner}/${GitHubRepo}"
              StringLike:
                # Two shapes, because two callers: pull requests carry
                # ":pull_request", the scheduled drift check carries the branch
                # ref. Wildcards absorb the immutable-claim @<id> suffixes.
                token.actions.githubusercontent.com:sub:
                  - !Sub "repo:${GitHubOwner}*/${GitHubRepo}*:pull_request"
                  - !Sub "repo:${GitHubOwner}*/${GitHubRepo}*:ref:refs/heads/${GitHubBranch}"
      Policies:
        - PolicyName: PreviewAndDetectDrift
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: PreviewChangesButNeverApplyThem
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResources
                  - cloudformation:GetTemplate
                  - cloudformation:GetTemplateSummary
                  - cloudformation:ListStackResources
                  # Drift detection is read-only despite the verb.
                  - cloudformation:DetectStackDrift
                  - cloudformation:DetectStackResourceDrift
                  - cloudformation:DescribeStackResourceDrifts
                Resource:
                  - !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${GitHubRepo}/*"
                  - !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:aws:transform/Serverless-2016-10-31"

              - Sid: PollDriftDetectionStatus
                Effect: Allow
                # This one takes a detection ID rather than a stack ARN, so it
                # cannot be resource-scoped and IAM denies it under a stack-scoped
                # statement. Found by running the drift workflow: DetectStackDrift
                # succeeded, polling its result was denied, and the workflow
                # reported no drift because the failure produced an empty answer.
                Action: cloudformation:DescribeStackDriftDetectionStatus
                Resource: "*"

              # Note the absence of ExecuteChangeSet, UpdateStack, CreateStack
              # and DeleteStack. That absence is the entire point of this role.

              # Drift detection reads each resource's live state using the
              # caller's own permissions, so this role needs read access to every
              # resource type the stack contains. Miss one and detection returns
              # DETECTION_FAILED rather than a useful answer.
              - Sid: ReadStateForDriftDetection
                Effect: Allow
                Action:
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                  - lambda:GetAlias
                  - lambda:ListVersionsByFunction
                  # For AWS::Lambda::Permission, which is the S3 invoke grant.
                  # Easy to miss: the resource is generated by SAM rather than
                  # written in template.yaml, so it is not obvious it needs
                  # covering.
                  - lambda:GetPolicy
                  - logs:DescribeLogGroups
                  - cloudwatch:DescribeAlarms
                  - sqs:GetQueueAttributes
                  - ec2:Describe*
                  - iam:GetRole
                  - iam:GetRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                Resource: "*"

              # S3 exposes bucket configuration through a long list of separate
              # Get* calls and drift detection reads all of them. Granted as a
              # wildcard on the action but pinned to this project's bucket, which
              # is tighter than the obvious alternative of attaching the managed
              # ReadOnlyAccess policy - that would let this role read object
              # contents across every bucket in an account that also hosts
              # unrelated production data.
              - Sid: ReadBucketConfiguration
                Effect: Allow
                Action:
                  - s3:GetBucket*
                  - s3:GetAccelerateConfiguration
                  - s3:GetAnalyticsConfiguration
                  - s3:GetEncryptionConfiguration
                  - s3:GetIntelligentTieringConfiguration
                  - s3:GetInventoryConfiguration
                  - s3:GetLifecycleConfiguration
                  - s3:GetMetricsConfiguration
                  - s3:GetReplicationConfiguration
                Resource: !Sub "arn:${AWS::Partition}:s3:::${GitHubRepo}-${AWS::AccountId}"

              - Sid: SamArtifactBucket
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource:
                  - !Sub "arn:${AWS::Partition}:s3:::aws-sam-cli-managed-*"
                  - !Sub "arn:${AWS::Partition}:s3:::aws-sam-cli-managed-*/*"

Outputs:
  EcrRepositoryUri:
    Description: URI of the ECR repository holding the Lambda image.
    Value: !GetAtt EcrRepository.RepositoryUri
    Export:
      Name: !Sub "${AWS::StackName}-EcrRepositoryUri"

  EcrRepositoryArn:
    Description: ARN of the ECR repository.
    Value: !GetAtt EcrRepository.Arn

  GitHubActionsRoleArn:
    Description: >
      Role ARN for the GitHub Actions workflow. Set this as the repository
      variable AWS_DEPLOY_ROLE_ARN.
    Value: !GetAtt GitHubActionsDeployRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-GitHubActionsRoleArn"

  GitHubActionsPlanRoleArn:
    Description: >
      Preview and drift-detection role. Set this as the repository variable
      AWS_PLAN_ROLE_ARN. Cannot execute change sets.
    Value: !GetAtt GitHubActionsPlanRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-GitHubActionsPlanRoleArn"

  OidcProviderArn:
    Description: OIDC provider trusted by the deployment role.
    Value: !If
      - CreateOidcProvider
      - !Ref GitHubOidcProvider
      - !Ref ExistingOidcProviderArn
